<radialGradient id="cg"><stop offset="0" stop-color="#FCD116"/><stop offset="1" stop-color="#00C48C"/></radialGradient>
<style>.f{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.fw{stroke-dasharray:5 9;animation:fw 1.4s linear infinite}
.core{fill:none;stroke:#00C48C;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:cp 4s ease-in-out infinite}
