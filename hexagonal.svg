<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Architecture hexagonale : adaptateurs entrants (API REST, application mobile, web), domaine au centre, adaptateurs sortants (base de données, événements)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<polygon id="H" points="0,-118 102.2,-59 102.2,59 0,118 -102.2,59 -102.2,-59"/>
